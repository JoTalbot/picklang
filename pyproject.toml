[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "picklang"
version = "0.1.10"
description = "PICK — компактный язык намерений для LLM-агентов + durable-исполнитель с replay, CAS и хэш-цепочкой (DurableWeave)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "JoTalbot" }]
keywords = ["llm", "agents", "durable-execution", "workflow", "temporal", "token-efficiency"]
dependencies = []

[project.optional-dependencies]
tokens = ["tiktoken"]
temporal = ["temporalio"]
mcp = ["mcp"]
dev = ["pytest", "tiktoken", "temporalio"]

[project.scripts]
pick = "picklang.cli:main"

[tool.setuptools.packages.find]
include = ["picklang*", "durable_weave*"]

[tool.pytest.ini_options]
testpaths = ["tests/"]
