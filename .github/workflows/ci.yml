name: PICK CI and live LLM eval

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live:
        description: "Run live Groq cascade (uses API quota)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# One active run per ref. New commits cancel older runs instead of queuing stale work.
concurrency:
  group: testing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Run untrusted PR code only on GitHub-hosted runners, never on the self-hosted machine.
  pr-tests:
    name: PR unit tests and package checks
    if: github.repository == 'JoTalbot/testing' && github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Build source distribution and wheel
        run: |
          python -m pip install build
          python -m build
          python - <<'PY'
          from pathlib import Path
          assert list(Path("dist").glob("*.whl")), "wheel was not produced"
          assert list(Path("dist").glob("*.tar.gz")), "source distribution was not produced"
          print("Wheel and source distribution built successfully.")
          PY

  tests:
    name: Unit tests and package checks
    if: github.repository == 'JoTalbot/testing' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Reject stale or untrusted run
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "JoTalbot/testing" || "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Only JoTalbot/testing on main is allowed to use this self-hosted runner."
            exit 1
          fi
          latest_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ -z "$latest_sha" || "$GITHUB_SHA" != "$latest_sha" ]]; then
            echo "::error::Stale workflow: this run is not for the current main commit."
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Build source distribution and wheel
        run: |
          python -m pip install build
          python -m build
          python - <<'PY'
          from pathlib import Path
          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          assert wheels, "wheel was not produced"
          assert sdists, "source distribution was not produced"
          print("Built:", *(str(p) for p in sorted(wheels + sdists)), sep="\\n  ")
          PY
      - name: Smoke-test built wheel in a clean environment
        run: |
          wheel_venv="/tmp/pick-wheel-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$wheel_venv"
          python -m venv "$wheel_venv"
          "$wheel_venv/bin/python" -m pip install --no-deps --force-reinstall dist/*.whl
          "$wheel_venv/bin/pick" --help
      - name: Verify CLI and demo
        run: |
          pick --help
          python demo.py
      - name: One-shot classic-code baseline benchmark
        run: |
          python bench_live_cycle.py --write
          echo "========== CLASSIC PYTHON BASELINE =========="
          cat docs/LIVE_CYCLE.md

  live-openrouter:
    name: Live Groq cascade
    needs: tests
    if: >-
      github.repository == 'JoTalbot/testing' &&
      github.ref == 'refs/heads/main' &&
      needs.tests.result == 'success' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_live))
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 25
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_TOKEN }}
      PICK_LIVE_PROVIDER: groq
      PICK_LIVE_API_URL: https://api.groq.com/openai/v1/chat/completions
      PICK_LIVE_MODEL_TIERS: ${{ vars.PICK_LIVE_MODEL_TIERS }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Reject stale run before using API quota
        shell: bash
        run: |
          set -euo pipefail
          latest_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "$GITHUB_REPOSITORY" != "JoTalbot/testing" || "$GITHUB_REF" != "refs/heads/main" || -z "$latest_sha" || "$GITHUB_SHA" != "$latest_sha" ]]; then
            echo "::error::Refusing live API calls from an untrusted or stale workflow run."
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Validate Groq secret is configured
        shell: bash
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::Repository secret GROQ_TOKEN is missing or empty."
            exit 1
          fi
      - name: Run live cascade
        run: python eval_live_cascade.py --timeout 45 --write --require-all
      - name: Run paired live PICK vs classic Python benchmark
        continue-on-error: true
        timeout-minutes: 22
        run: |
          python bench_pair.py \
            --tasks bench/live_paired_tasks.json \
            --pick-command "env PICK_AB_MODE=pick python bench_live_adapters.py" \
            --baseline-command "env PICK_AB_MODE=classic python bench_live_adapters.py" \
            --timeout 100 \
            --repeats 1 \
            --write bench/live_paired_ab.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("bench/live_paired_ab.json").read_text(encoding="utf-8"))
          print("PAIRED LIVE A/B RESULTS")
          print("| Task | PICK | Classic Python | PICK tokens | Classic tokens |")
          print("|---|---|---|---:|---:|")
          for p, b in zip(report["pick"], report["baseline"]):
              pt = (p.get("prompt_tokens", 0) or 0) + (p.get("completion_tokens", 0) or 0)
              bt = (b.get("prompt_tokens", 0) or 0) + (b.get("completion_tokens", 0) or 0)
              print(f"| {p['task']} | {'PASS' if p['ok'] else 'FAIL'} | {'PASS' if b['ok'] else 'FAIL'} | {pt} | {bt} |")
          for label, rows in (("PICK", report["pick"]), ("Classic Python", report["baseline"])):
              passed = sum(bool(row["ok"]) for row in rows)
              tokens = sum((row.get("prompt_tokens", 0) or 0) + (row.get("completion_tokens", 0) or 0) for row in rows)
              seconds = sum(row.get("seconds", 0) or 0 for row in rows)
              print(f"{label}: {passed}/{len(rows)} passed; {tokens} reported tokens; summed invocation time {seconds:.2f}s")
          print("Caveat: provider/model attempts can differ by validation failures; inspect raw report before drawing conclusions.")
          PY
          echo "========== RAW PAIRED A/B REPORT =========="
          cat bench/live_paired_ab.json
      - name: Print complete live results in logs
        if: always()
        shell: bash
        run: |
          echo "========== LIVE GROQ CASCADE =========="
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
          echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -f bench/live_cascade_results.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          rows = json.loads(Path("bench/live_cascade_results.json").read_text(encoding="utf-8"))
          print("\nTASK DETAILS")
          print("| Task | Result | Tier | Model | Attempts | Seconds | Prompt tokens | Completion tokens |")
          print("|---|---|---:|---|---:|---:|---:|---:|")
          for row in rows:
              print(
                  f"| {row.get('task')} | {'PASS' if row.get('ok') else 'FAIL'} "
                  f"| {row.get('tier')} | {row.get('model')} | {row.get('attempts')} "
                  f"| {row.get('seconds')} | {row.get('prompt_tokens', 0)} "
                  f"| {row.get('completion_tokens', 0)} |"
              )
              if row.get("error"):
                  print(f"ERROR [{row.get('task')}]: {row['error']}")
          total = len(rows)
          passed = sum(bool(row.get("ok")) for row in rows)
          tier0 = sum(bool(row.get("ok")) and row.get("tier") == 0 for row in rows)
          attempts = sum(row.get("attempts", 0) or 0 for row in rows)
          prompt_tokens = sum(row.get("prompt_tokens", 0) or 0 for row in rows)
          completion_tokens = sum(row.get("completion_tokens", 0) or 0 for row in rows)
          elapsed = round(sum(row.get("seconds", 0) or 0 for row in rows), 1)
          print("\nFINAL SUMMARY")
          print(f"Tasks passed: {passed}/{total}")
          print(f"Tier-0 successes: {tier0}/{total}")
          print(f"Attempts: {attempts}")
          print(f"Prompt tokens: {prompt_tokens}")
          print(f"Completion tokens: {completion_tokens}")
          print(f"Total tokens: {prompt_tokens + completion_tokens}")
          print(f"Sum of task durations: {elapsed}s")
          print("=============================================")
          PY
          else
            echo "ERROR: live result file was not produced."
            echo "Check the preceding 'Run live cascade' step for the failure reason."
          fi
      - name: Add live results to job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Live Groq cascade"
            echo ""
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Commit: $GITHUB_SHA"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            if [ -f bench/live_cascade_results.json ]; then
              python - <<'PY'
          import json
          from pathlib import Path

          rows = json.loads(Path("bench/live_cascade_results.json").read_text(encoding="utf-8"))
          print("| Task | Result | Tier | Model | Attempts | Seconds | Prompt tokens | Completion tokens |")
          print("|---|---|---:|---|---:|---:|---:|---:|")
          for row in rows:
              print(f"| {row.get('task')} | {'PASS' if row.get('ok') else 'FAIL'} | {row.get('tier')} | {row.get('model')} | {row.get('attempts')} | {row.get('seconds')} | {row.get('prompt_tokens', 0)} | {row.get('completion_tokens', 0)} |")
              if row.get("error"):
                  print(f"Error for {row.get('task')}: {row['error']}")
          passed = sum(bool(row.get("ok")) for row in rows)
          tier0 = sum(bool(row.get("ok")) and row.get("tier") == 0 for row in rows)
          attempts = sum(row.get("attempts", 0) or 0 for row in rows)
          prompt_tokens = sum(row.get("prompt_tokens", 0) or 0 for row in rows)
          completion_tokens = sum(row.get("completion_tokens", 0) or 0 for row in rows)
          elapsed = round(sum(row.get("seconds", 0) or 0 for row in rows), 1)
          print(f"\n**Total: {passed}/{len(rows)} tasks passed; tier-0: {tier0}; attempts: {attempts}; tokens: {prompt_tokens + completion_tokens} ({prompt_tokens} prompt + {completion_tokens} completion); summed task duration: {elapsed}s.**")
          PY
            else
              echo "Live result file was not produced. See the live cascade step logs for the failure."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    name: Publish versioned GitHub Release
    needs: [tests, live-openrouter]
    if: >-
      github.repository == 'JoTalbot/testing' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.tests.result == 'success' &&
      needs.live-openrouter.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Publish release only for an unpublished package version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
            exit 0
          fi
          if git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists without a GitHub Release; refusing to overwrite it."
            exit 1
          fi
          notes_file="$RUNNER_TEMP/release-notes.md"
          awk 'NR == 1 { print; next } /^---$/ { exit } { print }' RELEASE_NOTES.md > "$notes_file"
          gh release create "$tag" --target "$GITHUB_SHA" --title "picklang ${version}" --notes-file "$notes_file"
