name: PICK CI and live OpenRouter eval

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_live:
        description: "Run the live OpenRouter cascade (uses OPENROUTER_TOKEN; free-tier models)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: testing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests and package checks
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Verify CLI and demo
        run: |
          pick --help
          python demo.py

  live-openrouter:
    name: Live OpenRouter cascade
    if: github.event_name == 'workflow_dispatch' && inputs.run_live
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Validate secret is configured
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Repository secret OPENROUTER_TOKEN is missing or empty."
            exit 1
          fi
      - name: Run live cascade
        run: python eval_live_cascade.py --timeout 45 --write
      - name: Print concise results
        if: always()
        run: |
          if [ -f bench/live_cascade_results.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path("bench/live_cascade_results.json").read_text(encoding="utf-8"))
          for row in rows:
              print(f"{row.get('task')}: {'PASS' if row.get('ok') else 'FAIL'} "
                    f"tier={row.get('tier')} model={row.get('model')} "
                    f"attempts={row.get('attempts')} seconds={row.get('seconds')}")
          print(f"TOTAL: {sum(bool(r.get('ok')) for r in rows)}/{len(rows)}")
          PY
          fi
