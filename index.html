<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <title>ОРБИТА-9</title>
  <link rel="stylesheet" href="src/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛰</text></svg>">
</head>
<body>

<div id="app">

  <!-- ══════════ СТАРТОВЫЙ ЭКРАН ══════════ -->
  <section id="screen-start" class="screen">
    <div class="start-bg" id="start-bg"></div>
    <div class="start-inner start-inner-top">
      <div class="logo">🛰</div>
      <h1 class="title">ОРБИТА-9</h1>
      <p class="subtitle">Текстовая ролевая игра<br>про станцию, которая ломается</p>
      <div class="start-buttons">
        <button id="btn-continue" class="btn btn-primary hidden">Продолжить</button>
        <button id="btn-new" class="btn">Новая игра</button>
      </div>
      <p class="hint">Твои решения меняют то, что случится дальше.<br>Три финала. Ни одного правильного.</p>
    </div>
  </section>

  <!-- ══════════ ВЫБОР ГЕРОЯ ══════════ -->
  <section id="screen-create" class="screen hidden">
    <div class="create-inner">
      <h2 class="h2">Кем ты была на этой станции?</h2>
      <p class="muted">Это решит, какие проверки тебе легко даются. Плохого выбора нет — есть разный.</p>
      <div id="bg-list" class="bg-list"></div>
    </div>
  </section>

  <!-- ══════════ ИГРА ══════════ -->
  <section id="screen-game" class="screen hidden">
    <header class="topbar">
      <div class="topbar-left">
        <span id="chapter-label" class="chapter-label">Глава I</span>
        <span id="suit" class="suit" title="Целостность скафандра">●●●●</span>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" data-panel="skills" title="Навыки">📊</button>
        <button class="icon-btn" data-panel="bag" title="Сумка">🎒</button>
        <button class="icon-btn" data-panel="log" title="Дневник">📖</button>
      </div>
    </header>

    <main class="scene" id="scene">
      <figure class="art-wrap hidden" id="art-wrap">
        <div class="art-stage">
          <img id="art" class="art" alt="">
          <img id="art-b" class="art art-top" alt="" aria-hidden="true">
        </div>
        <!-- «Плашка» прямо на арте: где ты сейчас и какие есть ходы -->
        <div class="art-overlay">
          <div class="ov-top"><span id="ov-chapter" class="ov-chapter"></span></div>
          <div class="ov-bottom">
            <div class="ov-status" id="ov-status"></div>
            <div class="ov-choices" id="ov-choices"></div>
          </div>
        </div>
      </figure>
      <h2 id="scene-title" class="scene-title"></h2>
      <div id="scene-text" class="scene-text"></div>
    </main>

    <footer id="choices" class="choices"></footer>

    <div id="check-line" class="check-line hidden"></div>
  </section>

  <!-- ══════════ ФИНАЛ ══════════ -->
  <section id="screen-end" class="screen hidden">
    <div class="end-inner">
      <h2 id="end-title" class="end-title"></h2>
      <div id="end-text" class="scene-text"></div>
      <h3 class="h3">Что ты сделала</h3>
      <ol id="end-log" class="end-log"></ol>
      <button id="btn-restart" class="btn btn-primary">Начать заново</button>
    </div>
  </section>

  <!-- ══════════ ВЫДВИЖНАЯ ПАНЕЛЬ ══════════ -->
  <div id="sheet" class="sheet hidden">
    <div class="sheet-card">
      <div class="sheet-head">
        <h3 id="sheet-title"></h3>
        <button id="sheet-close" class="icon-btn">✕</button>
      </div>
      <div id="sheet-body" class="sheet-body"></div>
    </div>
  </div>

</div>

<!-- ══════════ ПОДКЛЮЧЕНИЕ ФАЙЛОВ ══════════ -->
<script src="src/state.js"></script>
<script src="src/story/chapter1.js"></script>
<script src="src/story/chapter2.js"></script>
<script src="src/story/chapter3.js"></script>
<script src="src/ui.js"></script>
<script src="src/game.js"></script>
</body>
</html>
