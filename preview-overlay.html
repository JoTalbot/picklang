<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ОРБИТА-9 · проверка плашки на арте</title>
<style>
  :root{--bg:#0b0f14;--amber:#ffb454;--teal:#4fd1c5;--line:#24323f;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:#d8e2ea;font-family:ui-monospace,Menlo,Consolas,monospace;padding:16px}
  h1{font-size:15px;letter-spacing:3px;color:var(--amber);margin:0 0 14px;text-transform:uppercase}
  .row{margin-bottom:26px}
  .cap{font-size:11px;color:#7d8f9e;margin-bottom:6px;letter-spacing:1px}
  .art-wrap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);max-width:520px}
  .art{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover}
  .art-overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:8px 10px;
    background:linear-gradient(180deg,#0b0f14d9 0%,#0b0f1400 22%),linear-gradient(0deg,#0b0f14f2 0%,#0b0f14b8 34%,#0b0f1400 62%)}
  .ov-chapter{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:#ffd9a0;text-shadow:0 1px 3px #000}
  .ov-bottom{display:flex;flex-direction:column;gap:6px}
  .ov-status{font-size:11px;line-height:1.35;color:#cfe0ec;text-shadow:0 1px 4px #000,0 0 8px #000}
  .ov-status b{color:var(--amber)}
  .ov-choices{display:flex;flex-wrap:wrap;gap:4px}
  .ov-chip{font-family:inherit;font-size:9.5px;line-height:1.25;color:#e8f2f8;background:#0b0f14c9;border:1px solid #ffffff26;
    border-radius:999px;padding:3px 7px;max-width:100%;text-align:left;text-shadow:0 1px 2px #000}
  .ov-chip .num{color:var(--teal);margin-right:3px}
</style>
</head>
<body>
<h1>Плашка на арте · как это выглядит</h1>

<div class="row">
  <div class="cap">Коридор — три хода открыто, ключ-карты пока нет</div>
  <figure class="art-wrap">
    <img class="art" src="assets/art/web/corridor.jpg" alt="">
    <div class="art-overlay">
      <div class="ov-top"><span class="ov-chapter">Глава I</span></div>
      <div class="ov-bottom">
        <div class="ov-status"><b>Коридор сектора B</b> · ключ-карты нет · Ковач выслушал</div>
        <div class="ov-choices">
          <span class="ov-chip"><span class="num">1</span>Зайти к Ирис в оранжерею</span>
          <span class="ov-chip"><span class="num">2</span>Спуститься к реактору</span>
          <span class="ov-chip"><span class="num">3</span>Пройти на шлюзовую палубу</span>
        </div>
      </div>
    </div>
  </figure>
</div>

<div class="row">
  <div class="cap">Точка невозврата — три финала прямо на картинке</div>
  <figure class="art-wrap">
    <img class="art" src="assets/art/web/final_choice.jpg" alt="">
    <div class="art-overlay">
      <div class="ov-top"><span class="ov-chapter">Глава III</span></div>
      <div class="ov-bottom">
        <div class="ov-status"><b>Точка невозврата</b> · сигнал известен · техник спасён</div>
        <div class="ov-choices">
          <span class="ov-chip"><span class="num">1</span>Улететь на шлюпке</span>
          <span class="ov-chip"><span class="num">2</span>Остаться и держать станцию</span>
          <span class="ov-chip"><span class="num">3</span>Отдать энергию сигналу</span>
        </div>
      </div>
    </div>
  </figure>
</div>

<div class="row">
  <div class="cap">Медотсек — состояние по умолчанию</div>
  <figure class="art-wrap">
    <img class="art" src="assets/art/web/wake.jpg" alt="">
    <div class="art-overlay">
      <div class="ov-top"><span class="ov-chapter">Глава I</span></div>
      <div class="ov-bottom">
        <div class="ov-status"><b>Медотсек · время неизвестно</b> · сумка: Мультитул · решений: 0</div>
        <div class="ov-choices">
          <span class="ov-chip"><span class="num">1</span>Сколько я проспала?</span>
          <span class="ov-chip"><span class="num">2</span>Сначала осмотреться</span>
          <span class="ov-chip"><span class="num">3</span>Проверить скафандр</span>
        </div>
      </div>
    </div>
  </figure>
</div>

</body>
</html>
